[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# stage modules are imported as top-level modules (generate.py runs as a script)
known-first-party = ["anomalies", "common", "events", "handover", "maintenance", "master", "shifts", "tasks", "telemetry", "weather"]

[tool.black]
line-length = 100
target-version = ["py311"]
